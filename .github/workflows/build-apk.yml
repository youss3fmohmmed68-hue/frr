name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Show repository
        run: |
          echo "========== REPOSITORY =========="
          pwd
          echo ""
          find . -maxdepth 5 -print
          echo "================================"


      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir project

          echo "========== ZIP CONTENT =========="

          unzip -l "$ZIP_FILE"

          echo "================================="

          unzip -q "$ZIP_FILE" -d project

          echo ""
          echo "========== EXTRACTED PROJECT =========="

          find project -type f -print | sort

          echo "======================================="


      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          SETTINGS=$(find project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then

            echo ""
            echo "======================================"
            echo "NO GRADLE PROJECT FOUND"
            echo "======================================"

            echo ""
            echo "All extracted files:"

            find project -type f -print | sort

            echo ""
            echo "Directories:"

            find project -type d -print | sort

            echo ""
            echo "======================================"

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo ""
          echo "======================================"
          echo "ANDROID PROJECT FOUND"
          echo "======================================"

          echo "Settings:"
          echo "$SETTINGS"

          echo ""
          echo "Project root:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"


      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="$PROJECT_DIR/debug.keystore"

          echo "Creating:"
          echo "$KEYSTORE"

          if [ ! -f "$KEYSTORE" ]; then

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          ls -lh "$KEYSTORE"


      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Running assembleDebug..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "BUILD SUCCESSFUL"


      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          COUNT=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            ${{ env.PROJECT_DIR }}/**/*.apk
          if-no-files-found: error
          retention-days: 7            \) \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo ""
            echo "Available Gradle files:"
            
            find project \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
                -o \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "Gradle settings file:"
          echo "$SETTINGS_FILE"

          echo ""
          echo "REAL PROJECT ROOT:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -200

          echo ""

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 5. Setup Java
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 6. Setup Gradle
      # ==========================================
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"


      # ==========================================
      # 7. Create debug keystore
      # ==========================================
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Creating debug.keystore..."
          echo "======================================"

          KEYSTORE="$PROJECT_DIR/debug.keystore"

          if [ -f "$KEYSTORE" ]; then
            echo "debug.keystore already exists."
          else

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "debug.keystore created successfully."

          fi

          echo ""
          echo "Keystore:"
          ls -lh "$KEYSTORE"


      # ==========================================
      # 8. Build APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "Building Android APK..."
          echo "======================================"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Gradle files:"
          ls -la

          echo ""
          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Running assembleDebug..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "BUILD SUCCESSFUL"


      # ==========================================
      # 9. Find generated APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for APK..."
          echo "======================================"

          APK_COUNT=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | wc -l)

          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "Generated APK files:"
          echo "--------------------------------------"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          echo "--------------------------------------"


      # ==========================================
      # 10. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
