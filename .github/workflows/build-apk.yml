name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Find ZIP
      # ==========================================
      - name: Find ZIP project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Android ZIP..."
          echo "======================================"

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP project found."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 3. Extract ZIP
      # ==========================================
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Extracting project..."
          echo "======================================"

          rm -rf project

          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo ""
          echo "Extracted files:"
          echo "--------------------------------------"

          find project \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -300

          echo "--------------------------------------"


      # ==========================================
      # 4. Find REAL Gradle root
      # ==========================================
      - name: Find Gradle project root
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Gradle project..."
          echo "======================================"

          SETTINGS_FILE=$(find project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo ""
            echo "Available Gradle files:"
            
            find project \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
                -o \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "Gradle settings file:"
          echo "$SETTINGS_FILE"

          echo ""
          echo "REAL PROJECT ROOT:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -200

          echo ""

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 5. Setup Java
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 6. Setup Gradle
      # ==========================================
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"


      # ==========================================
      # 7. Create debug keystore
      # ==========================================
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Creating debug.keystore..."
          echo "======================================"

          KEYSTORE="$PROJECT_DIR/debug.keystore"

          if [ -f "$KEYSTORE" ]; then
            echo "debug.keystore already exists."
          else

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "debug.keystore created successfully."

          fi

          echo ""
          echo "Keystore:"
          ls -lh "$KEYSTORE"


      # ==========================================
      # 8. Build APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "Building Android APK..."
          echo "======================================"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Gradle files:"
          ls -la

          echo ""
          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Running assembleDebug..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "BUILD SUCCESSFUL"


      # ==========================================
      # 9. Find generated APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for APK..."
          echo "======================================"

          APK_COUNT=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | wc -l)

          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "Generated APK files:"
          echo "--------------------------------------"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          echo "--------------------------------------"


      # ==========================================
      # 10. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
