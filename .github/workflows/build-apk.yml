name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Find and Extract ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP..."

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -200

      - name: Find Web Project
        shell: bash
        run: |
          set -e

          echo "Searching for package.json..."

          PACKAGE_JSON=$(find extracted -type f -name "package.json" | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo "Project directory: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Project files:"
          ls -la

          echo ""
          echo "package.json:"
          cat package.json

      - name: Install Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Installing dependencies..."

          if [ -f "bun.lock" ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Build Web App
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Building web application..."

          bun run build

          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder was not created."
            exit 1
          fi

          echo "Web build completed."

      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Installing Capacitor..."

          bun add @capacitor/core @capacitor/android
          bun add -d @capacitor/cli

      - name: Create Capacitor Config
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.example.crimsonai',
            appName: 'Crimson AI',
            webDir: 'dist'
          };

          export default config;
          EOF

          cat capacitor.config.ts

      - name: Add Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Creating Android project..."

          if [ -d "android" ]; then
            echo "Android folder already exists."
          else
            bunx cap add android
          fi

      - name: Copy Web To Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          bunx cap copy android

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Check Java
        run: |
          echo "Java version:"
          java -version

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo "Making Gradle executable..."
          chmod +x gradlew

          echo "Gradle version:"
          ./gradlew --version

          echo "Building APK..."

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "${PROJECT_DIR}/android" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "${PROJECT_DIR}/android" \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
