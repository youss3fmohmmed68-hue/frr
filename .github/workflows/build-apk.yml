name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP project
        shell: bash
        run: |
          echo "Searching for ZIP project..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP project found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Project structure:"
          find project -maxdepth 3 -type f | head -200

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create debug keystore
        shell: bash
        working-directory: project
        run: |
          echo "Creating debug.keystore..."

          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "debug.keystore created successfully."

      - name: Build Debug APK
        shell: bash
        working-directory: project
        run: |
          echo "Building APK..."
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for generated APK..."

          find project \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "project/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
