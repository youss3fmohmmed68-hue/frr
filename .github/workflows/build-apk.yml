name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. تحميل المستودع
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ========================================
      # 2. إعداد Node
      # ========================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ========================================
      # 3. إعداد Bun
      # ========================================
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest


      # ========================================
      # 4. البحث عن ZIP وفك المشروع
      # ========================================
      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for ZIP..."
          echo "======================================"

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -200


      # ========================================
      # 5. البحث عن package.json
      # ========================================
      - name: Find Web Project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for package.json..."
          echo "======================================"

          PACKAGE=$(find extracted -type f -name "package.json" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json was not found."
            echo ""
            echo "Available files:"
            find extracted -maxdepth 4 -type f | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")

          echo ""
          echo "======================================"
          echo "WEB PROJECT FOUND"
          echo "======================================"
          echo "$PROJECT_DIR"

          echo ""
          echo "package.json:"
          cat "$PROJECT_DIR/package.json"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ========================================
      # 6. تثبيت Dependencies
      # ========================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Installing dependencies..."
          echo "======================================"

          bun install --frozen-lockfile


      # ========================================
      # 7. بناء مشروع Web
      # ========================================
      - name: Build Web App
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Building Web App..."
          echo "======================================"

          bun run build

          echo ""
          echo "Build completed."

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          echo ""
          echo "Dist contents:"
          find dist -maxdepth 2 -type f | head -100


      # ========================================
      # 8. تثبيت Capacitor
      # ========================================
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Installing Capacitor..."
          echo "======================================"

          bun add @capacitor/core @capacitor/android
          bun add -d @capacitor/cli


      # ========================================
      # 9. إنشاء capacitor.config.ts
      # ========================================
      - name: Create Capacitor config
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.example.crimsonai',
            appName: 'Crimson AI',
            webDir: 'dist',
            bundledWebRuntime: false
          };

          export default config;
          EOF

          echo "Capacitor config:"
          cat capacitor.config.ts


      # ========================================
      # 10. إنشاء مشروع Android
      # ========================================
      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Adding Android platform..."
          echo "======================================"

          npx cap add android


      # ========================================
      # 11. نسخ ملفات Web إلى Android
      # ========================================
      - name: Copy Web Files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Copying Web files to Android..."
          echo "======================================"

          npx cap copy android


      # ========================================
      # 12. إعداد Java 21
      # ========================================
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # ========================================
      # 13. التحقق من Java
      # ========================================
      - name: Check Java
        shell: bash
        run: |
          echo "======================================"
          echo "JAVA VERSION"
          echo "======================================"

          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"


      # ========================================
      # 14. التحقق من Android project
      # ========================================
      - name: Check Android Project
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"

          ls -la

          echo ""
          echo "Gradle wrapper:"
          ls -la gradlew

          echo ""
          echo "Gradle version:"
          ./gradlew --version


      # ========================================
      # 15. بناء APK
      # ========================================
      - name: Build Debug APK
       

      # =========================
      # 9. Install Capacitor
      # =========================
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          bun add @capacitor/core @capacitor/android
          bun add -d @capacitor/cli


      # =========================
      # 10. Create Capacitor Config
      # =========================
      - name: Create Capacitor config
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.example.crimsonai',
            appName: 'Crimson AI',
            webDir: 'dist',
            bundledWebRuntime: false
          };

          export default config;
          EOF


      # =========================
      # 11. Add Android
      # =========================
      - name: Add Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap add android


      # =========================
      # 12. Copy Web to Android
      # =========================
      - name: Copy Web Files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap copy android


      # =========================
      # 13. Java 17
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================
      # 14. Build APK
      # =========================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace


      # =========================
      # 15. Find APK
      # =========================
      - name: Find APK
        shell: bash
        run: |
          echo "================================"
          echo "GENERATED APK"
          echo "================================"

          find "$PROJECT_DIR/android" \
            -type f \
            -name "*.apk" \
            -print


      # =========================
      # 16. Upload APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error          ./gradlew assembleDebug --no-daemon --stacktrace

      # 13 - البحث عن APK
      - name: Find APK
        run: |
          echo "=============================="
          echo "APK FILES"
          echo "=============================="

          find project/android \
            -type f \
            -name "*.apk" \
            -print

      # 14 - رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
